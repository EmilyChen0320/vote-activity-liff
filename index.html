<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ad5cac" />
    <title>投票活動</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
      // 正式環境由後端 Blade 頁面外殼注入，這裡只是預設值。
      // enableLiff 預設 true：後端若只填文件列出的四個欄位而漏了這個，
      // 留 false 會把 LINE 登入整個擋掉（畫面顯示「缺少 LIFF 設定」）。
      window.endpoint = window.endpoint ?? {
        liffId: '',
        basicId: '',
        lineCrmApiBaseUrl: '',
        voteActivityId: '',
        enableLiff: true,
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
